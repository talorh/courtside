<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" width="760" height="190" role="img" aria-labelledby="dg-branches-t dg-branches-d" class="dg">
<style>.dg text{font-family:system-ui, -apple-system, 'Segoe UI', sans-serif}
.dg-box rect{fill:#FFFFFF;stroke:#E1E5E2;stroke-width:1.5}
.dg-t{fill:#121513;font-size:14px;font-weight:700;text-anchor:middle}
.dg-s{fill:#5D6862;font-size:11.5px;text-anchor:middle}
.dg-m{fill:#121513;font-size:11.5px}
.k-person rect{stroke:#121513}
.k-edge rect{fill:#FFF4D6;stroke:#7A5800}
.k-worker rect{fill:#14274E;stroke:#2F6FDB}
.k-worker .dg-t{fill:#fff}.k-worker .dg-s{fill:#CFE5D6}
.k-store rect{fill:#E4ECFB;stroke:#2F6FDB}
.k-service rect{stroke:#2F6FDB}
.k-job rect{fill:#F6F7F6;stroke:#5D6862;stroke-dasharray:6 4}
.k-stop rect{stroke:#D9262C}.k-stop .dg-t{fill:#D9262C}
.k-done rect{fill:#2F6FDB;stroke:#2F6FDB}
.k-done .dg-t{fill:#fff}.k-done .dg-s{fill:#E3F3E8}
.dg-arrow{fill:none;stroke:#5D6862;stroke-width:1.6}
.dg-arrow.dash{stroke:#2F6FDB;stroke-dasharray:6 4}
.dg-head{fill:#5D6862}
.dg-life{stroke:#E1E5E2;stroke-width:1.2;stroke-dasharray:3 4}
.dg-label{fill:#5D6862;font-size:11.5px;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.dg-label.mid{text-anchor:middle}
.dg-zone rect{fill:none;stroke:#E1E5E2;stroke-width:1.5;stroke-dasharray:7 5}
.dg-zone text{fill:#5D6862;font-size:12px;font-weight:700}</style>
<rect width="760" height="190" fill="#FFFFFF"/>
<title id="dg-branches-t">The branches</title><desc id="dg-branches-d">Feature and fix branches come off staging and are merged back into it; main is only ever fast-forwarded to staging for a release.</desc>
<defs><marker id="ah-branches" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs>
<g class="dg-box k-step"><rect x="20" y="20" width="200" height="56" rx="10"/>
<text class="dg-t" x="120" y="45">feature/&lt;name&gt;</text><text class="dg-s" x="120" y="62">a new thing, tests first</text></g>
<g class="dg-box k-step"><rect x="20" y="110" width="200" height="56" rx="10"/>
<text class="dg-t" x="120" y="135">fix/&lt;name&gt;</text><text class="dg-s" x="120" y="152">a repair, test first</text></g>
<g class="dg-box k-service"><rect x="290" y="65" width="190" height="56" rx="10"/>
<text class="dg-t" x="385" y="90">staging</text><text class="dg-s" x="385" y="107">npm run staging deploys it</text></g>
<g class="dg-box k-done"><rect x="550" y="65" width="190" height="56" rx="10"/>
<text class="dg-t" x="645" y="90">main</text><text class="dg-s" x="645" y="107">npm run release deploys it</text></g>
<path class="dg-arrow" d="M220 48 L288 85" marker-end="url(#ah-branches)"/><text class="dg-label" x="226" y="40">merged in</text><path class="dg-arrow" d="M220 138 L288 101" marker-end="url(#ah-branches)"/>
<path class="dg-arrow" d="M480 93 L548 93" marker-end="url(#ah-branches)"/><text class="dg-label" x="482" y="82">fast-forward</text></svg>
