<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-labelledby="dg-costflow-t dg-costflow-d" class="dg">
<style>.dg text{font-family:system-ui, -apple-system, 'Segoe UI', sans-serif}
.dg-box rect{fill:#FFFFFF;stroke:#E1E5E2;stroke-width:1.5}
.dg-t{fill:#121513;font-size:14px;font-weight:700;text-anchor:middle}
.dg-s{fill:#5D6862;font-size:11.5px;text-anchor:middle}
.dg-m{fill:#121513;font-size:11.5px}
.k-person rect{stroke:#121513}
.k-edge rect{fill:#FFF4D6;stroke:#7A5800}
.k-worker rect{fill:#14274E;stroke:#2F6FDB}
.k-worker .dg-t{fill:#fff}.k-worker .dg-s{fill:#CFE5D6}
.k-store rect{fill:#E4ECFB;stroke:#2F6FDB}
.k-service rect{stroke:#2F6FDB}
.k-job rect{fill:#F6F7F6;stroke:#5D6862;stroke-dasharray:6 4}
.k-stop rect{stroke:#D9262C}.k-stop .dg-t{fill:#D9262C}
.k-done rect{fill:#2F6FDB;stroke:#2F6FDB}
.k-done .dg-t{fill:#fff}.k-done .dg-s{fill:#E3F3E8}
.dg-arrow{fill:none;stroke:#5D6862;stroke-width:1.6}
.dg-arrow.dash{stroke:#2F6FDB;stroke-dasharray:6 4}
.dg-head{fill:#5D6862}
.dg-life{stroke:#E1E5E2;stroke-width:1.2;stroke-dasharray:3 4}
.dg-label{fill:#5D6862;font-size:11.5px;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.dg-label.mid{text-anchor:middle}
.dg-zone rect{fill:none;stroke:#E1E5E2;stroke-width:1.5;stroke-dasharray:7 5}
.dg-zone text{fill:#5D6862;font-size:12px;font-weight:700}</style>
<rect width="760" height="290" fill="#FFFFFF"/>
<title id="dg-costflow-t">A team&#39;s month of costs</title><desc id="dg-costflow-d">A team&#39;s month adds up its own video storage past the bundle, its minutes watched, its originals in R2 past the free 10 GB, and a share of the site&#39;s fixed costs by the days it ran; that is turned from US dollars into Australian at the day&#39;s rate and set against the team&#39;s season budget, which raises the Team budgets alert if it&#39;s over or heading over.</desc>
<defs><marker id="ah-costflow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs>
<g class="dg-box k-store"><rect x="10" y="20" width="250" height="52" rx="10"/>
<text class="dg-t" x="135" y="43">Its video storage</text><text class="dg-s" x="135" y="60">Stream minutes past the bundle</text></g><g class="dg-box k-service"><rect x="10" y="86" width="250" height="52" rx="10"/>
<text class="dg-t" x="135" y="109">Its watching</text><text class="dg-s" x="135" y="126">US$1 for each 1,000 minutes</text></g><g class="dg-box k-store"><rect x="10" y="152" width="250" height="52" rx="10"/>
<text class="dg-t" x="135" y="175">Its originals in R2</text><text class="dg-s" x="135" y="192">past the free 10 GB, its share</text></g><g class="dg-box k-step"><rect x="10" y="218" width="250" height="52" rx="10"/>
<text class="dg-t" x="135" y="241">A share of fixed costs</text><text class="dg-s" x="135" y="258">by the days it ran that month</text></g>
<g class="dg-box k-job"><rect x="310" y="112" width="180" height="56" rx="10"/>
<text class="dg-t" x="400" y="137">The team&#39;s month</text><text class="dg-s" x="400" y="154">in US dollars</text></g>
<path class="dg-arrow" d="M260 46 L285 46 L285 140 L308 140" marker-end="url(#ah-costflow)"/><path class="dg-arrow" d="M260 112 L285 112 L285 140 L308 140" marker-end="url(#ah-costflow)"/><path class="dg-arrow" d="M260 178 L285 178 L285 140 L308 140" marker-end="url(#ah-costflow)"/><path class="dg-arrow" d="M260 244 L285 244 L285 140 L308 140" marker-end="url(#ah-costflow)"/>
<g class="dg-box k-edge"><rect x="530" y="20" width="220" height="56" rx="10"/>
<text class="dg-t" x="640" y="45">In the club&#39;s currency at the day&#39;s rate</text><text class="dg-s" x="640" y="62">the ECB&#39;s, kept six hours</text></g>
<g class="dg-box k-done"><rect x="530" y="112" width="220" height="56" rx="10"/>
<text class="dg-t" x="640" y="137">Against its budget</text><text class="dg-s" x="640" y="154">$200 a season unless set</text></g>
<g class="dg-box k-stop"><rect x="530" y="204" width="220" height="56" rx="10"/>
<text class="dg-t" x="640" y="229">The Team budgets alert</text><text class="dg-s" x="640" y="246">urgent over, warns heading over</text></g>
<path class="dg-arrow" d="M490 140 L510 140 L510 48 L528 48" marker-end="url(#ah-costflow)"/><path class="dg-arrow" d="M640 76 L640 110" marker-end="url(#ah-costflow)"/><path class="dg-arrow" d="M640 168 L640 202" marker-end="url(#ah-costflow)"/></svg>
