<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" role="img" aria-labelledby="dg-people-t dg-people-d" class="dg">
<style>.dg text{font-family:system-ui, -apple-system, 'Segoe UI', sans-serif}
.dg-box rect{fill:#FFFFFF;stroke:#E1E5E2;stroke-width:1.5}
.dg-t{fill:#121513;font-size:14px;font-weight:700;text-anchor:middle}
.dg-s{fill:#5D6862;font-size:11.5px;text-anchor:middle}
.dg-m{fill:#121513;font-size:11.5px}
.k-person rect{stroke:#121513}
.k-edge rect{fill:#FFF4D6;stroke:#7A5800}
.k-worker rect{fill:#14274E;stroke:#2F6FDB}
.k-worker .dg-t{fill:#fff}.k-worker .dg-s{fill:rgba(255,255,255,.78)}
.k-store rect{fill:#E4ECFB;stroke:#2F6FDB}
.k-service rect{stroke:#2F6FDB}
.k-job rect{fill:#F6F7F6;stroke:#5D6862;stroke-dasharray:6 4}
.k-stop rect{stroke:#D9262C}.k-stop .dg-t{fill:#D9262C}
.k-done rect{fill:#2F6FDB;stroke:#2F6FDB}
.k-done .dg-t{fill:#fff}.k-done .dg-s{fill:rgba(255,255,255,.85)}
.dg-arrow{fill:none;stroke:#5D6862;stroke-width:1.6}
.dg-arrow.dash{stroke:#2F6FDB;stroke-dasharray:6 4}
.dg-head{fill:#5D6862}
.dg-life{stroke:#E1E5E2;stroke-width:1.2;stroke-dasharray:3 4}
.dg-label{fill:#5D6862;font-size:11.5px;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.dg-label.mid{text-anchor:middle}
.dg-zone rect{fill:none;stroke:#E1E5E2;stroke-width:1.5;stroke-dasharray:7 5}
.dg-zone text{fill:#5D6862;font-size:12px;font-weight:700}</style>
<rect width="760" height="220" fill="#FFFFFF"/>
<title id="dg-people-t">People and players</title><desc id="dg-people-d">A team manager adds a person with their email, name and role; they&#39;re on the team&#39;s list, so they can ask for a sign-in code, and every request checks the list for what their role allows. Players, a name and number each, appear in Home&#39;s squad, tag highlight clips and gather each player&#39;s clips at the season&#39;s end.</desc>
<defs><marker id="ah-people" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs>
<g class="dg-box k-person"><rect x="10" y="30" width="170" height="56" rx="10"/>
<text class="dg-t" x="95" y="55">Add a person</text><text class="dg-s" x="95" y="72">email, name and role</text></g><g class="dg-box k-store"><rect x="200" y="30" width="170" height="56" rx="10"/>
<text class="dg-t" x="285" y="55">On the team&#39;s list</text><text class="dg-s" x="285" y="72">members, in D1</text></g><g class="dg-box k-edge"><rect x="390" y="30" width="170" height="56" rx="10"/>
<text class="dg-t" x="475" y="55">Asks for a code</text><text class="dg-s" x="475" y="72">only to a listed address</text></g><g class="dg-box k-worker"><rect x="580" y="30" width="170" height="56" rx="10"/>
<text class="dg-t" x="665" y="55">Their role&#39;s pages</text><text class="dg-s" x="665" y="72">the list checked every time</text></g><g class="dg-box k-person"><rect x="10" y="140" width="170" height="56" rx="10"/>
<text class="dg-t" x="95" y="165">Players</text><text class="dg-s" x="95" y="182">name and number, up to 10</text></g><g class="dg-box k-step"><rect x="200" y="140" width="170" height="56" rx="10"/>
<text class="dg-t" x="285" y="165">Home&#39;s squad</text><text class="dg-s" x="285" y="182">a singlet with their number</text></g><g class="dg-box k-step"><rect x="390" y="140" width="170" height="56" rx="10"/>
<text class="dg-t" x="475" y="165">Clip tags</text><text class="dg-s" x="475" y="182">who&#39;s in each clip</text></g><g class="dg-box k-done"><rect x="580" y="140" width="170" height="56" rx="10"/>
<text class="dg-t" x="665" y="165">Season&#39;s reels</text><text class="dg-s" x="665" y="182">each player&#39;s clips</text></g>
<path class="dg-arrow" d="M180 58 L198 58" marker-end="url(#ah-people)"/><path class="dg-arrow" d="M370 58 L388 58" marker-end="url(#ah-people)"/><path class="dg-arrow" d="M560 58 L578 58" marker-end="url(#ah-people)"/>
<path class="dg-arrow" d="M180 168 L198 168" marker-end="url(#ah-people)"/><path class="dg-arrow" d="M95 196 L95 210 L475 210 L475 198" marker-end="url(#ah-people)"/><path class="dg-arrow" d="M560 168 L578 168" marker-end="url(#ah-people)"/></svg>
