<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 235" width="760" height="235" role="img" aria-labelledby="dg-removal-t dg-removal-d" class="dg">
<style>.dg text{font-family:system-ui, -apple-system, 'Segoe UI', sans-serif}
.dg-box rect{fill:#FFFFFF;stroke:#E1E5E2;stroke-width:1.5}
.dg-t{fill:#121513;font-size:14px;font-weight:700;text-anchor:middle}
.dg-s{fill:#5D6862;font-size:11.5px;text-anchor:middle}
.dg-m{fill:#121513;font-size:11.5px}
.k-person rect{stroke:#121513}
.k-edge rect{fill:#FFF4D6;stroke:#7A5800}
.k-worker rect{fill:#14274E;stroke:#2F6FDB}
.k-worker .dg-t{fill:#fff}.k-worker .dg-s{fill:rgba(255,255,255,.78)}
.k-store rect{fill:#E4ECFB;stroke:#2F6FDB}
.k-service rect{stroke:#2F6FDB}
.k-job rect{fill:#F6F7F6;stroke:#5D6862;stroke-dasharray:6 4}
.k-stop rect{stroke:#D9262C}.k-stop .dg-t{fill:#D9262C}
.k-done rect{fill:#2F6FDB;stroke:#2F6FDB}
.k-done .dg-t{fill:#fff}.k-done .dg-s{fill:rgba(255,255,255,.85)}
.dg-arrow{fill:none;stroke:#5D6862;stroke-width:1.6}
.dg-arrow.dash{stroke:#2F6FDB;stroke-dasharray:6 4}
.dg-head{fill:#5D6862}
.dg-life{stroke:#E1E5E2;stroke-width:1.2;stroke-dasharray:3 4}
.dg-label{fill:#5D6862;font-size:11.5px;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.dg-label.mid{text-anchor:middle}
.dg-zone rect{fill:none;stroke:#E1E5E2;stroke-width:1.5;stroke-dasharray:7 5}
.dg-zone text{fill:#5D6862;font-size:12px;font-weight:700}</style>
<rect width="760" height="235" fill="#FFFFFF"/>
<title id="dg-removal-t">A removal request&#39;s path</title><desc id="dg-removal-d">Any member asks for a video, clip or photo to be removed, with a reason; the request waits on the team manager&#39;s Manage team and shows in Notifications and on the admins&#39; Insights; the team manager deletes it, which closes every open request for it, or keeps it with a note.</desc>
<defs><marker id="ah-removal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs>
<g class="dg-box k-person"><rect x="10" y="30" width="230" height="56" rx="10"/>
<text class="dg-t" x="125" y="55">Ask for it to be removed</text><text class="dg-s" x="125" y="72">a video, clip or photo, any member</text></g>
<g class="dg-box k-service"><rect x="265" y="30" width="230" height="56" rx="10"/>
<text class="dg-t" x="380" y="55">Waiting on Manage team</text><text class="dg-s" x="380" y="72">in Notifications and Insights too</text></g>
<g class="dg-box k-step"><rect x="520" y="30" width="230" height="56" rx="10"/>
<text class="dg-t" x="635" y="55">Team manager decides</text><text class="dg-s" x="635" y="72">the reason beside it</text></g>
<g class="dg-box k-stop"><rect x="265" y="140" width="230" height="56" rx="10"/>
<text class="dg-t" x="380" y="165">Deleted</text><text class="dg-s" x="380" y="182">every open request for it closed</text></g>
<g class="dg-box k-done"><rect x="520" y="140" width="230" height="56" rx="10"/>
<text class="dg-t" x="635" y="165">Kept</text><text class="dg-s" x="635" y="182">the request closed, with a note</text></g>
<path class="dg-arrow" d="M240 58 L263 58" marker-end="url(#ah-removal)"/><path class="dg-arrow" d="M495 58 L518 58" marker-end="url(#ah-removal)"/>
<path class="dg-arrow" d="M635 86 L635 138" marker-end="url(#ah-removal)"/><path class="dg-arrow" d="M590 86 L590 112 L380 112 L380 138" marker-end="url(#ah-removal)"/>
<text class="dg-label" x="10" y="222">A team manager can also delete a clip or photo straight from its page; whoever added a photo can delete their own.</text></svg>
