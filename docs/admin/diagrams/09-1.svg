<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="dg-fixturein-t dg-fixturein-d" class="dg">
<style>.dg text{font-family:system-ui, -apple-system, 'Segoe UI', sans-serif}
.dg-box rect{fill:#FFFFFF;stroke:#E1E5E2;stroke-width:1.5}
.dg-t{fill:#121513;font-size:14px;font-weight:700;text-anchor:middle}
.dg-s{fill:#5D6862;font-size:11.5px;text-anchor:middle}
.dg-m{fill:#121513;font-size:11.5px}
.k-person rect{stroke:#121513}
.k-edge rect{fill:#FFF4D6;stroke:#7A5800}
.k-worker rect{fill:#14274E;stroke:#2F6FDB}
.k-worker .dg-t{fill:#fff}.k-worker .dg-s{fill:#CFE5D6}
.k-store rect{fill:#E4ECFB;stroke:#2F6FDB}
.k-service rect{stroke:#2F6FDB}
.k-job rect{fill:#F6F7F6;stroke:#5D6862;stroke-dasharray:6 4}
.k-stop rect{stroke:#D9262C}.k-stop .dg-t{fill:#D9262C}
.k-done rect{fill:#2F6FDB;stroke:#2F6FDB}
.k-done .dg-t{fill:#fff}.k-done .dg-s{fill:#E3F3E8}
.dg-arrow{fill:none;stroke:#5D6862;stroke-width:1.6}
.dg-arrow.dash{stroke:#2F6FDB;stroke-dasharray:6 4}
.dg-head{fill:#5D6862}
.dg-life{stroke:#E1E5E2;stroke-width:1.2;stroke-dasharray:3 4}
.dg-label{fill:#5D6862;font-size:11.5px;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.dg-label.mid{text-anchor:middle}
.dg-zone rect{fill:none;stroke:#E1E5E2;stroke-width:1.5;stroke-dasharray:7 5}
.dg-zone text{fill:#5D6862;font-size:12px;font-weight:700}</style>
<rect width="760" height="300" fill="#FFFFFF"/>
<title id="dg-fixturein-t">How games come into the fixture</title><desc id="dg-fixturein-d">A PlayHQ team link is read from PlayHQ&#39;s feed and its games saved straight away, then checked again by themselves; any other public fixture page is read by Workers AI, and a spreadsheet is read in the Worker; those two are shown to check first, and only the ticked games are added.</desc>
<defs><marker id="ah-fixturein" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs>
<g class="dg-box k-person"><rect x="10" y="20" width="210" height="56" rx="10"/>
<text class="dg-t" x="115" y="45">A PlayHQ team link</text><text class="dg-s" x="115" y="62">VJBL or a tournament</text></g>
<g class="dg-box k-person"><rect x="275" y="20" width="210" height="56" rx="10"/>
<text class="dg-t" x="380" y="45">Any fixture page</text><text class="dg-s" x="380" y="62">a club site, a draw, a tournament</text></g>
<g class="dg-box k-person"><rect x="540" y="20" width="210" height="56" rx="10"/>
<text class="dg-t" x="645" y="45">A spreadsheet</text><text class="dg-s" x="645" y="62">a CSV, Australian dates</text></g>
<g class="dg-box k-service"><rect x="10" y="120" width="210" height="56" rx="10"/>
<text class="dg-t" x="115" y="145">PlayHQ&#39;s feed</text><text class="dg-s" x="115" y="162">api.playhq.com/graphql</text></g>
<g class="dg-box k-service"><rect x="275" y="120" width="210" height="56" rx="10"/>
<text class="dg-t" x="380" y="145">Workers AI</text><text class="dg-s" x="380" y="162">reads the page&#39;s text</text></g>
<g class="dg-box k-worker"><rect x="540" y="120" width="210" height="56" rx="10"/>
<text class="dg-t" x="645" y="145">Read in the Worker</text><text class="dg-s" x="645" y="162">columns found by their names</text></g>
<g class="dg-box k-done"><rect x="10" y="220" width="210" height="56" rx="10"/>
<text class="dg-t" x="115" y="245">Saved at once</text><text class="dg-s" x="115" y="262">then checked by itself</text></g>
<g class="dg-box k-step"><rect x="275" y="220" width="300" height="56" rx="10"/>
<text class="dg-t" x="425" y="245">Shown to check first</text><text class="dg-s" x="425" y="262">problems listed, repeats left out</text></g>
<g class="dg-box k-done"><rect x="600" y="220" width="150" height="56" rx="10"/>
<text class="dg-t" x="675" y="245">Ticked ones in</text><text class="dg-s" x="675" y="262">in one batch</text></g>
<path class="dg-arrow" d="M115 76 L115 118" marker-end="url(#ah-fixturein)"/><path class="dg-arrow" d="M380 76 L380 118" marker-end="url(#ah-fixturein)"/><path class="dg-arrow" d="M645 76 L645 118" marker-end="url(#ah-fixturein)"/>
<path class="dg-arrow" d="M115 176 L115 218" marker-end="url(#ah-fixturein)"/><path class="dg-arrow" d="M380 176 L380 218" marker-end="url(#ah-fixturein)"/><path class="dg-arrow" d="M645 176 L645 198 L520 198 L520 218" marker-end="url(#ah-fixturein)"/>
<path class="dg-arrow" d="M575 248 L598 248" marker-end="url(#ah-fixturein)"/></svg>
