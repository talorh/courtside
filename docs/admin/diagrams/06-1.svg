<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 604" width="660" height="604" role="img" aria-labelledby="dg-signin-t dg-signin-d" class="dg">
<style>.dg text{font-family:system-ui, -apple-system, 'Segoe UI', sans-serif}
.dg-box rect{fill:#FFFFFF;stroke:#E1E5E2;stroke-width:1.5}
.dg-t{fill:#121513;font-size:14px;font-weight:700;text-anchor:middle}
.dg-s{fill:#5D6862;font-size:11.5px;text-anchor:middle}
.dg-m{fill:#121513;font-size:11.5px}
.k-person rect{stroke:#121513}
.k-edge rect{fill:#FFF4D6;stroke:#7A5800}
.k-worker rect{fill:#14274E;stroke:#2F6FDB}
.k-worker .dg-t{fill:#fff}.k-worker .dg-s{fill:rgba(255,255,255,.78)}
.k-store rect{fill:#E4ECFB;stroke:#2F6FDB}
.k-service rect{stroke:#2F6FDB}
.k-job rect{fill:#F6F7F6;stroke:#5D6862;stroke-dasharray:6 4}
.k-stop rect{stroke:#D9262C}.k-stop .dg-t{fill:#D9262C}
.k-done rect{fill:#2F6FDB;stroke:#2F6FDB}
.k-done .dg-t{fill:#fff}.k-done .dg-s{fill:rgba(255,255,255,.85)}
.dg-arrow{fill:none;stroke:#5D6862;stroke-width:1.6}
.dg-arrow.dash{stroke:#2F6FDB;stroke-dasharray:6 4}
.dg-head{fill:#5D6862}
.dg-life{stroke:#E1E5E2;stroke-width:1.2;stroke-dasharray:3 4}
.dg-label{fill:#5D6862;font-size:11.5px;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.dg-label.mid{text-anchor:middle}
.dg-zone rect{fill:none;stroke:#E1E5E2;stroke-width:1.5;stroke-dasharray:7 5}
.dg-zone text{fill:#5D6862;font-size:12px;font-weight:700}</style>
<rect width="660" height="604" fill="#FFFFFF"/>
<title id="dg-signin-t">Signing in</title><desc id="dg-signin-d">Someone types their email. Turnstile checks a person is asking. A code is only sent to an address on a team&#39;s list or an admin&#39;s, within the limits. The code lasts 10 minutes, and a right code gives a 30-day session on that device.</desc>
<defs><marker id="ah-signin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs>
<g class="dg-box k-person"><rect x="30" y="16" width="330" height="58" rx="10"/>
<text class="dg-t" x="195" y="42">The sign-in page</text><text class="dg-s" x="195" y="59">the email is typed</text></g>
<path class="dg-arrow" d="M195 74 L195 100" marker-end="url(#ah-signin)"/>
<g class="dg-box k-edge"><rect x="30" y="102" width="330" height="58" rx="10"/>
<text class="dg-t" x="195" y="128">A person, not a script?</text><text class="dg-s" x="195" y="145">Turnstile, checked with Cloudflare</text></g>
<path class="dg-arrow" d="M195 160 L195 186" marker-end="url(#ah-signin)"/>
<g class="dg-box k-stop"><rect x="420" y="102" width="220" height="58" rx="10"/>
<text class="dg-t" x="530" y="128">No code sent</text><text class="dg-s" x="530" y="145">told to try again</text></g><path class="dg-arrow" d="M360 131 L418 131" marker-end="url(#ah-signin)"/><g class="dg-box k-step"><rect x="30" y="188" width="330" height="58" rx="10"/>
<text class="dg-t" x="195" y="214">On a team&#39;s list, or an admin?</text><text class="dg-s" x="195" y="231">checked in D1</text></g>
<path class="dg-arrow" d="M195 246 L195 272" marker-end="url(#ah-signin)"/>
<g class="dg-box k-stop"><rect x="420" y="188" width="220" height="58" rx="10"/>
<text class="dg-t" x="530" y="214">No code sent</text><text class="dg-s" x="530" y="231">told to ask their team manager</text></g><path class="dg-arrow" d="M360 217 L418 217" marker-end="url(#ah-signin)"/><g class="dg-box k-step"><rect x="30" y="274" width="330" height="58" rx="10"/>
<text class="dg-t" x="195" y="300">Within the limits?</text><text class="dg-s" x="195" y="317">per address, per IP, site-wide</text></g>
<path class="dg-arrow" d="M195 332 L195 358" marker-end="url(#ah-signin)"/>
<g class="dg-box k-stop"><rect x="420" y="274" width="220" height="58" rx="10"/>
<text class="dg-t" x="530" y="300">No code sent</text><text class="dg-s" x="530" y="317">told to wait</text></g><path class="dg-arrow" d="M360 303 L418 303" marker-end="url(#ah-signin)"/><g class="dg-box k-service"><rect x="30" y="360" width="330" height="58" rx="10"/>
<text class="dg-t" x="195" y="386">A code is emailed</text><text class="dg-s" x="195" y="403">six digits, good for 10 minutes</text></g>
<path class="dg-arrow" d="M195 418 L195 444" marker-end="url(#ah-signin)"/>
<g class="dg-box k-step"><rect x="30" y="446" width="330" height="58" rx="10"/>
<text class="dg-t" x="195" y="472">The code is typed</text><text class="dg-s" x="195" y="489">checked against its hash</text></g>
<path class="dg-arrow" d="M195 504 L195 530" marker-end="url(#ah-signin)"/>
<g class="dg-box k-stop"><rect x="420" y="446" width="220" height="58" rx="10"/>
<text class="dg-t" x="530" y="472">Five wrong tries</text><text class="dg-s" x="530" y="489">and the code is void</text></g><path class="dg-arrow" d="M360 475 L418 475" marker-end="url(#ah-signin)"/><g class="dg-box k-done"><rect x="30" y="532" width="330" height="58" rx="10"/>
<text class="dg-t" x="195" y="558">Signed in for 30 days</text><text class="dg-s" x="195" y="575">on this device</text></g>

</svg>
