<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-labelledby="dg-codeflow-t dg-codeflow-d" class="dg">
<style>.dg text{font-family:system-ui, -apple-system, 'Segoe UI', sans-serif}
.dg-box rect{fill:#FFFFFF;stroke:#E1E5E2;stroke-width:1.5}
.dg-t{fill:#121513;font-size:14px;font-weight:700;text-anchor:middle}
.dg-s{fill:#5D6862;font-size:11.5px;text-anchor:middle}
.dg-m{fill:#121513;font-size:11.5px}
.k-person rect{stroke:#121513}
.k-edge rect{fill:#FFF4D6;stroke:#7A5800}
.k-worker rect{fill:#14274E;stroke:#2F6FDB}
.k-worker .dg-t{fill:#fff}.k-worker .dg-s{fill:rgba(255,255,255,.78)}
.k-store rect{fill:#E4ECFB;stroke:#2F6FDB}
.k-service rect{stroke:#2F6FDB}
.k-job rect{fill:#F6F7F6;stroke:#5D6862;stroke-dasharray:6 4}
.k-stop rect{stroke:#D9262C}.k-stop .dg-t{fill:#D9262C}
.k-done rect{fill:#2F6FDB;stroke:#2F6FDB}
.k-done .dg-t{fill:#fff}.k-done .dg-s{fill:rgba(255,255,255,.85)}
.dg-arrow{fill:none;stroke:#5D6862;stroke-width:1.6}
.dg-arrow.dash{stroke:#2F6FDB;stroke-dasharray:6 4}
.dg-head{fill:#5D6862}
.dg-life{stroke:#E1E5E2;stroke-width:1.2;stroke-dasharray:3 4}
.dg-label{fill:#5D6862;font-size:11.5px;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.dg-label.mid{text-anchor:middle}
.dg-zone rect{fill:none;stroke:#E1E5E2;stroke-width:1.5;stroke-dasharray:7 5}
.dg-zone text{fill:#5D6862;font-size:12px;font-weight:700}</style>
<rect width="760" height="260" fill="#FFFFFF"/>
<title id="dg-codeflow-t">The code&#39;s path to the live site</title><desc id="dg-codeflow-d">The production folder pushes main to the Artifacts repository with a ten-minute token; Workers Builds sees the push, runs the checks and deploys the Worker; a new computer clones the repository with a read token.</desc>
<defs><marker id="ah-codeflow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs>
<g class="dg-box k-step"><rect x="20" y="40" width="190" height="56" rx="10"/>
<text class="dg-t" x="115" y="65">courtside-prod folder</text><text class="dg-s" x="115" y="82">main, after the release&#39;s checks</text></g>
<g class="dg-box k-store"><rect x="285" y="40" width="200" height="56" rx="10"/>
<text class="dg-t" x="385" y="65">Artifacts: courtside/courtside</text><text class="dg-s" x="385" y="82">the repository, in the account</text></g>
<g class="dg-box k-job"><rect x="545" y="40" width="195" height="56" rx="10"/>
<text class="dg-t" x="642.5" y="65">Workers Builds</text><text class="dg-s" x="642.5" y="82">npm ci &amp;&amp; npm run check</text></g>
<g class="dg-box k-worker"><rect x="545" y="170" width="195" height="56" rx="10"/>
<text class="dg-t" x="642.5" y="195">Worker: courtside</text><text class="dg-s" x="642.5" y="212">live on saints.example</text></g>
<g class="dg-box k-person"><rect x="20" y="170" width="190" height="56" rx="10"/>
<text class="dg-t" x="115" y="195">A new computer</text><text class="dg-s" x="115" y="212">clone, then carry on</text></g>
<path class="dg-arrow" d="M210 68 L283 68" marker-end="url(#ah-codeflow)"/><text class="dg-label" x="180" y="30">push, ten-minute token</text><path class="dg-arrow" d="M485 68 L543 68" marker-end="url(#ah-codeflow)"/><text class="dg-label" x="472" y="30">a push to main</text>
<path class="dg-arrow" d="M642 96 L642 168" marker-end="url(#ah-codeflow)"/><text class="dg-label" x="652" y="136">deploy:builds</text>
<path class="dg-arrow dash" d="M210 198 L250 198 L250 110 L385 110 L385 96" marker-end="url(#ah-codeflow)"/><text class="dg-label" x="260" y="126">clone with a read token</text></svg>
