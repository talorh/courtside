<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" role="img" aria-labelledby="dg-rosterfill-t dg-rosterfill-d" class="dg">
<style>.dg text{font-family:system-ui, -apple-system, 'Segoe UI', sans-serif}
.dg-box rect{fill:#FFFFFF;stroke:#E1E5E2;stroke-width:1.5}
.dg-t{fill:#121513;font-size:14px;font-weight:700;text-anchor:middle}
.dg-s{fill:#5D6862;font-size:11.5px;text-anchor:middle}
.dg-m{fill:#121513;font-size:11.5px}
.k-person rect{stroke:#121513}
.k-edge rect{fill:#FFF4D6;stroke:#7A5800}
.k-worker rect{fill:#14274E;stroke:#2F6FDB}
.k-worker .dg-t{fill:#fff}.k-worker .dg-s{fill:rgba(255,255,255,.78)}
.k-store rect{fill:#E4ECFB;stroke:#2F6FDB}
.k-service rect{stroke:#2F6FDB}
.k-job rect{fill:#F6F7F6;stroke:#5D6862;stroke-dasharray:6 4}
.k-stop rect{stroke:#D9262C}.k-stop .dg-t{fill:#D9262C}
.k-done rect{fill:#2F6FDB;stroke:#2F6FDB}
.k-done .dg-t{fill:#fff}.k-done .dg-s{fill:rgba(255,255,255,.85)}
.dg-arrow{fill:none;stroke:#5D6862;stroke-width:1.6}
.dg-arrow.dash{stroke:#2F6FDB;stroke-dasharray:6 4}
.dg-head{fill:#5D6862}
.dg-life{stroke:#E1E5E2;stroke-width:1.2;stroke-dasharray:3 4}
.dg-label{fill:#5D6862;font-size:11.5px;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.dg-label.mid{text-anchor:middle}
.dg-zone rect{fill:none;stroke:#E1E5E2;stroke-width:1.5;stroke-dasharray:7 5}
.dg-zone text{fill:#5D6862;font-size:12px;font-weight:700}</style>
<rect width="760" height="230" fill="#FFFFFF"/>
<title id="dg-rosterfill-t">How a roster week is filled</title><desc id="dg-rosterfill-d">The roster takes the fixture&#39;s weeks, gives each game its slots, gives a duty one family does every week to that family, then shares the rest among the families free that week with the fewest duties, in the cheapest way for evenness, and afterwards swaps duties between families wherever that evens them out.</desc>
<defs><marker id="ah-rosterfill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs>
<g class="dg-box k-store"><rect x="30" y="30" width="220" height="56" rx="10"/>
<text class="dg-t" x="140" y="55">The fixture&#39;s weeks</text><text class="dg-s" x="140" y="72">Monday to Sunday, this season</text></g><g class="dg-box k-step"><rect x="270" y="30" width="220" height="56" rx="10"/>
<text class="dg-t" x="380" y="55">Each game&#39;s slots</text><text class="dg-s" x="380" y="72">video, two scorers, lollies</text></g><g class="dg-box k-step"><rect x="510" y="30" width="220" height="56" rx="10"/>
<text class="dg-t" x="620" y="55">Every-week families</text><text class="dg-s" x="620" y="72">their duty first, and no other</text></g><g class="dg-box k-job"><rect x="510" y="130" width="220" height="56" rx="10"/>
<text class="dg-t" x="620" y="155">Fewest duties first</text><text class="dg-s" x="620" y="172">the families free that week</text></g><g class="dg-box k-job"><rect x="270" y="130" width="220" height="56" rx="10"/>
<text class="dg-t" x="380" y="155">The cheapest share</text><text class="dg-s" x="380" y="172">each duty as even as it can be</text></g><g class="dg-box k-done"><rect x="30" y="130" width="220" height="56" rx="10"/>
<text class="dg-t" x="140" y="155">Swaps to even out</text><text class="dg-s" x="140" y="172">totals within one of each other</text></g>
<path class="dg-arrow" d="M250 58 L268 58" marker-end="url(#ah-rosterfill)"/><path class="dg-arrow" d="M490 58 L508 58" marker-end="url(#ah-rosterfill)"/><path class="dg-arrow" d="M620 86 L620 128" marker-end="url(#ah-rosterfill)"/>
<path class="dg-arrow" d="M510 158 L492 158" marker-end="url(#ah-rosterfill)"/><path class="dg-arrow" d="M270 158 L252 158" marker-end="url(#ah-rosterfill)"/>
<text class="dg-label" x="30" y="215">More slots than families (a tournament weekend): a family takes a second game, never the same game twice.</text></svg>
