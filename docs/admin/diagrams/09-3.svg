<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-labelledby="dg-airead-t dg-airead-d" class="dg">
<style>.dg text{font-family:system-ui, -apple-system, 'Segoe UI', sans-serif}
.dg-box rect{fill:#FFFFFF;stroke:#E1E5E2;stroke-width:1.5}
.dg-t{fill:#121513;font-size:14px;font-weight:700;text-anchor:middle}
.dg-s{fill:#5D6862;font-size:11.5px;text-anchor:middle}
.dg-m{fill:#121513;font-size:11.5px}
.k-person rect{stroke:#121513}
.k-edge rect{fill:#FFF4D6;stroke:#7A5800}
.k-worker rect{fill:#14274E;stroke:#2F6FDB}
.k-worker .dg-t{fill:#fff}.k-worker .dg-s{fill:rgba(255,255,255,.78)}
.k-store rect{fill:#E4ECFB;stroke:#2F6FDB}
.k-service rect{stroke:#2F6FDB}
.k-job rect{fill:#F6F7F6;stroke:#5D6862;stroke-dasharray:6 4}
.k-stop rect{stroke:#D9262C}.k-stop .dg-t{fill:#D9262C}
.k-done rect{fill:#2F6FDB;stroke:#2F6FDB}
.k-done .dg-t{fill:#fff}.k-done .dg-s{fill:rgba(255,255,255,.85)}
.dg-arrow{fill:none;stroke:#5D6862;stroke-width:1.6}
.dg-arrow.dash{stroke:#2F6FDB;stroke-dasharray:6 4}
.dg-head{fill:#5D6862}
.dg-life{stroke:#E1E5E2;stroke-width:1.2;stroke-dasharray:3 4}
.dg-label{fill:#5D6862;font-size:11.5px;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.dg-label.mid{text-anchor:middle}
.dg-zone rect{fill:none;stroke:#E1E5E2;stroke-width:1.5;stroke-dasharray:7 5}
.dg-zone text{fill:#5D6862;font-size:12px;font-weight:700}</style>
<rect width="760" height="350" fill="#FFFFFF"/>
<title id="dg-airead-t">Reading a fixture page with AI</title><desc id="dg-airead-d">The team manager pastes a fixture page&#39;s link; the Worker fetches the page securely, cuts it down to its text, and sends that with the team&#39;s names to Workers AI, which answers with the team&#39;s games as JSON; the Worker checks every game and shows them to check.</desc>
<defs><marker id="ah-airead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs>
<line class="dg-life" x1="80" y1="60" x2="80" y2="340"/>
<g class="dg-box k-person"><rect x="10" y="14" width="140" height="44" rx="10"/><text class="dg-t" x="80" y="41">Team manager</text></g><line class="dg-life" x1="280" y1="60" x2="280" y2="340"/>
<g class="dg-box k-worker"><rect x="210" y="14" width="140" height="44" rx="10"/><text class="dg-t" x="280" y="41">Worker</text></g><line class="dg-life" x1="480" y1="60" x2="480" y2="340"/>
<g class="dg-box k-edge"><rect x="410" y="14" width="140" height="44" rx="10"/><text class="dg-t" x="480" y="41">The page</text></g><line class="dg-life" x1="670" y1="60" x2="670" y2="340"/>
<g class="dg-box k-service"><rect x="600" y="14" width="140" height="44" rx="10"/><text class="dg-t" x="670" y="41">Workers AI</text></g>
<path class="dg-arrow" d="M84 100 L276 100" marker-end="url(#ah-airead)"/>
<text class="dg-label mid" x="180" y="92">the page&#39;s link</text>
<path class="dg-arrow" d="M284 144 L476 144" marker-end="url(#ah-airead)"/>
<text class="dg-label mid" x="380" y="136">fetched over https</text>
<path class="dg-arrow" d="M476 188 L284 188" marker-end="url(#ah-airead)"/>
<text class="dg-label mid" x="380" y="180">up to 2 MB of HTML</text>
<path class="dg-arrow" d="M284 232 L666 232" marker-end="url(#ah-airead)"/>
<text class="dg-label mid" x="475" y="224">its text, and the team&#39;s names</text>
<path class="dg-arrow" d="M666 276 L284 276" marker-end="url(#ah-airead)"/>
<text class="dg-label mid" x="475" y="268">the team&#39;s games, as JSON</text>
<path class="dg-arrow" d="M276 320 L84 320" marker-end="url(#ah-airead)"/>
<text class="dg-label mid" x="180" y="312">the games to check</text></svg>
