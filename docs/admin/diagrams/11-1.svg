<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500" role="img" aria-labelledby="dg-upload-t dg-upload-d" class="dg">
<style>.dg text{font-family:system-ui, -apple-system, 'Segoe UI', sans-serif}
.dg-box rect{fill:#FFFFFF;stroke:#E1E5E2;stroke-width:1.5}
.dg-t{fill:#121513;font-size:14px;font-weight:700;text-anchor:middle}
.dg-s{fill:#5D6862;font-size:11.5px;text-anchor:middle}
.dg-m{fill:#121513;font-size:11.5px}
.k-person rect{stroke:#121513}
.k-edge rect{fill:#FFF4D6;stroke:#7A5800}
.k-worker rect{fill:#14274E;stroke:#2F6FDB}
.k-worker .dg-t{fill:#fff}.k-worker .dg-s{fill:rgba(255,255,255,.78)}
.k-store rect{fill:#E4ECFB;stroke:#2F6FDB}
.k-service rect{stroke:#2F6FDB}
.k-job rect{fill:#F6F7F6;stroke:#5D6862;stroke-dasharray:6 4}
.k-stop rect{stroke:#D9262C}.k-stop .dg-t{fill:#D9262C}
.k-done rect{fill:#2F6FDB;stroke:#2F6FDB}
.k-done .dg-t{fill:#fff}.k-done .dg-s{fill:rgba(255,255,255,.85)}
.dg-arrow{fill:none;stroke:#5D6862;stroke-width:1.6}
.dg-arrow.dash{stroke:#2F6FDB;stroke-dasharray:6 4}
.dg-head{fill:#5D6862}
.dg-life{stroke:#E1E5E2;stroke-width:1.2;stroke-dasharray:3 4}
.dg-label{fill:#5D6862;font-size:11.5px;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.dg-label.mid{text-anchor:middle}
.dg-zone rect{fill:none;stroke:#E1E5E2;stroke-width:1.5;stroke-dasharray:7 5}
.dg-zone text{fill:#5D6862;font-size:12px;font-weight:700}</style>
<rect width="700" height="500" fill="#FFFFFF"/>
<title id="dg-upload-t">Uploading a game&#39;s video</title><desc id="dg-upload-d">The phone asks the Worker to start, the Worker opens a multipart upload in R2, the phone sends the parts straight to R2, the Worker completes it and asks Stream to copy it, and Stream pulls the original from R2.</desc>
<defs><marker id="ah-upload" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs>
<line class="dg-life" x1="90" y1="60" x2="90" y2="440"/>
<g class="dg-box k-person"><rect x="20" y="14" width="140" height="44" rx="10"/><text class="dg-t" x="90" y="41">Phone</text></g><line class="dg-life" x1="260" y1="60" x2="260" y2="440"/>
<g class="dg-box k-worker"><rect x="190" y="14" width="140" height="44" rx="10"/><text class="dg-t" x="260" y="41">Worker</text></g><line class="dg-life" x1="440" y1="60" x2="440" y2="440"/>
<g class="dg-box k-store"><rect x="370" y="14" width="140" height="44" rx="10"/><text class="dg-t" x="440" y="41">R2</text></g><line class="dg-life" x1="610" y1="60" x2="610" y2="440"/>
<g class="dg-box k-service"><rect x="540" y="14" width="140" height="44" rx="10"/><text class="dg-t" x="610" y="41">Stream</text></g>
<path class="dg-arrow" d="M94 100 L256 100" marker-end="url(#ah-upload)"/>
<text class="dg-label mid" x="175" y="92">start: the game, the file&#39;s size</text>
<path class="dg-arrow" d="M264 146 L436 146" marker-end="url(#ah-upload)"/>
<text class="dg-label mid" x="350" y="138">open a multipart upload</text>
<path class="dg-arrow" d="M256 192 L94 192" marker-end="url(#ah-upload)"/>
<text class="dg-label mid" x="175" y="184">signed links for the parts</text>
<path class="dg-arrow dash" d="M94 238 L436 238" marker-end="url(#ah-upload)"/>
<text class="dg-label mid" x="265" y="230">16 MB parts, six at a time</text>
<path class="dg-arrow" d="M94 284 L256 284" marker-end="url(#ah-upload)"/>
<text class="dg-label mid" x="175" y="276">every part sent</text>
<path class="dg-arrow" d="M264 330 L436 330" marker-end="url(#ah-upload)"/>
<text class="dg-label mid" x="350" y="322">complete the upload</text>
<path class="dg-arrow" d="M264 376 L606 376" marker-end="url(#ah-upload)"/>
<text class="dg-label mid" x="435" y="368">copy it, from a signed link</text>
<path class="dg-arrow" d="M606 422 L444 422" marker-end="url(#ah-upload)"/>
<text class="dg-label mid" x="525" y="414">pulls the original</text>
<g class="dg-box k-job"><rect x="170" y="448" width="510" height="40" rx="10"/>
<text class="dg-t" x="425" y="473">The 5-minute job checks Stream until it&#39;s ready to watch</text></g></svg>
