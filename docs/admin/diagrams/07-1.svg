<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" width="760" height="210" role="img" aria-labelledby="dg-lifecycle-t dg-lifecycle-d" class="dg">
<style>.dg text{font-family:system-ui, -apple-system, 'Segoe UI', sans-serif}
.dg-box rect{fill:#FFFFFF;stroke:#E1E5E2;stroke-width:1.5}
.dg-t{fill:#121513;font-size:14px;font-weight:700;text-anchor:middle}
.dg-s{fill:#5D6862;font-size:11.5px;text-anchor:middle}
.dg-m{fill:#121513;font-size:11.5px}
.k-person rect{stroke:#121513}
.k-edge rect{fill:#FFF4D6;stroke:#7A5800}
.k-worker rect{fill:#14274E;stroke:#2F6FDB}
.k-worker .dg-t{fill:#fff}.k-worker .dg-s{fill:rgba(255,255,255,.78)}
.k-store rect{fill:#E4ECFB;stroke:#2F6FDB}
.k-service rect{stroke:#2F6FDB}
.k-job rect{fill:#F6F7F6;stroke:#5D6862;stroke-dasharray:6 4}
.k-stop rect{stroke:#D9262C}.k-stop .dg-t{fill:#D9262C}
.k-done rect{fill:#2F6FDB;stroke:#2F6FDB}
.k-done .dg-t{fill:#fff}.k-done .dg-s{fill:rgba(255,255,255,.85)}
.dg-arrow{fill:none;stroke:#5D6862;stroke-width:1.6}
.dg-arrow.dash{stroke:#2F6FDB;stroke-dasharray:6 4}
.dg-head{fill:#5D6862}
.dg-life{stroke:#E1E5E2;stroke-width:1.2;stroke-dasharray:3 4}
.dg-label{fill:#5D6862;font-size:11.5px;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.dg-label.mid{text-anchor:middle}
.dg-zone rect{fill:none;stroke:#E1E5E2;stroke-width:1.5;stroke-dasharray:7 5}
.dg-zone text{fill:#5D6862;font-size:12px;font-weight:700}</style>
<rect width="760" height="210" fill="#FFFFFF"/>
<title id="dg-lifecycle-t">A team&#39;s life on the site</title><desc id="dg-lifecycle-d">A team is onboarded, runs its season (its setup checklist first), is closed at the season&#39;s end and becomes read-only, and is deleted with its footage on 31 December of the year its season ends or on a night an admin picks. A closed team can be reopened until deleting starts.</desc>
<defs><marker id="ah-lifecycle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs>
<g class="dg-box k-step"><rect x="10" y="40" width="170" height="56" rx="10"/>
<text class="dg-t" x="95" y="65">Onboarded</text><text class="dg-s" x="95" y="82">code, season, team manager</text></g>
<g class="dg-box k-done"><rect x="200" y="40" width="170" height="56" rx="10"/>
<text class="dg-t" x="285" y="65">Running</text><text class="dg-s" x="285" y="82">the checklist, then the season</text></g>
<g class="dg-box k-service"><rect x="390" y="40" width="170" height="56" rx="10"/>
<text class="dg-t" x="475" y="65">Closed</text><text class="dg-s" x="475" y="82">End season: read-only</text></g>
<g class="dg-box k-stop"><rect x="580" y="40" width="170" height="56" rx="10"/>
<text class="dg-t" x="665" y="65">Deleted</text><text class="dg-s" x="665" y="82">31 Dec, or a night chosen</text></g>
<path class="dg-arrow" d="M180 68 L198 68" marker-end="url(#ah-lifecycle)"/><path class="dg-arrow" d="M370 68 L388 68" marker-end="url(#ah-lifecycle)"/><path class="dg-arrow" d="M560 68 L578 68" marker-end="url(#ah-lifecycle)"/>
<path class="dg-arrow" d="M475 96 L475 140 L285 140 L285 98" marker-end="url(#ah-lifecycle)"/><text class="dg-label" x="300" y="160">Reopen, until deleting starts</text>
<text class="dg-label" x="10" y="196">Each team is one season&#39;s squad: a new season is a new team, onboarded again.</text></svg>
