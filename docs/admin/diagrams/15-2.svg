<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img" aria-labelledby="dg-ticket-t dg-ticket-d" class="dg">
<style>.dg text{font-family:system-ui, -apple-system, 'Segoe UI', sans-serif}
.dg-box rect{fill:#FFFFFF;stroke:#E1E5E2;stroke-width:1.5}
.dg-t{fill:#121513;font-size:14px;font-weight:700;text-anchor:middle}
.dg-s{fill:#5D6862;font-size:11.5px;text-anchor:middle}
.dg-m{fill:#121513;font-size:11.5px}
.k-person rect{stroke:#121513}
.k-edge rect{fill:#FFF4D6;stroke:#7A5800}
.k-worker rect{fill:#14274E;stroke:#2F6FDB}
.k-worker .dg-t{fill:#fff}.k-worker .dg-s{fill:#CFE5D6}
.k-store rect{fill:#E4ECFB;stroke:#2F6FDB}
.k-service rect{stroke:#2F6FDB}
.k-job rect{fill:#F6F7F6;stroke:#5D6862;stroke-dasharray:6 4}
.k-stop rect{stroke:#D9262C}.k-stop .dg-t{fill:#D9262C}
.k-done rect{fill:#2F6FDB;stroke:#2F6FDB}
.k-done .dg-t{fill:#fff}.k-done .dg-s{fill:#E3F3E8}
.dg-arrow{fill:none;stroke:#5D6862;stroke-width:1.6}
.dg-arrow.dash{stroke:#2F6FDB;stroke-dasharray:6 4}
.dg-head{fill:#5D6862}
.dg-life{stroke:#E1E5E2;stroke-width:1.2;stroke-dasharray:3 4}
.dg-label{fill:#5D6862;font-size:11.5px;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.dg-label.mid{text-anchor:middle}
.dg-zone rect{fill:none;stroke:#E1E5E2;stroke-width:1.5;stroke-dasharray:7 5}
.dg-zone text{fill:#5D6862;font-size:12px;font-weight:700}</style>
<rect width="760" height="240" fill="#FFFFFF"/>
<title id="dg-ticket-t">A support ticket&#39;s path</title><desc id="dg-ticket-d">A team manager asks with Contact support; the ticket is saved first and then emailed to the admins; an admin replies on the site or adds a private note, which leaves it waiting on the team manager, who is emailed; their reply goes back to the admins, and a resolved ticket opens again if they reply.</desc>
<defs><marker id="ah-ticket" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs>
<g class="dg-box k-person"><rect x="10" y="30" width="170" height="56" rx="10"/>
<text class="dg-t" x="95" y="55">Contact support</text><text class="dg-s" x="95" y="72">a team manager&#39;s question</text></g>
<g class="dg-box k-store"><rect x="200" y="30" width="170" height="56" rx="10"/>
<text class="dg-t" x="285" y="55">A ticket, saved</text><text class="dg-s" x="285" y="72">then emailed to the admins</text></g>
<g class="dg-box k-step"><rect x="390" y="30" width="170" height="56" rx="10"/>
<text class="dg-t" x="475" y="55">An admin replies</text><text class="dg-s" x="475" y="72">or adds a private note</text></g>
<g class="dg-box k-service"><rect x="580" y="30" width="170" height="56" rx="10"/>
<text class="dg-t" x="665" y="55">Waiting for you</text><text class="dg-s" x="665" y="72">the team manager emailed</text></g>
<g class="dg-box k-person"><rect x="580" y="140" width="170" height="56" rx="10"/>
<text class="dg-t" x="665" y="165">They reply</text><text class="dg-s" x="665" y="182">on the ticket&#39;s page</text></g>
<g class="dg-box k-done"><rect x="200" y="140" width="170" height="56" rx="10"/>
<text class="dg-t" x="285" y="165">Resolved</text><text class="dg-s" x="285" y="182">a reply opens it again</text></g>
<path class="dg-arrow" d="M180 58 L198 58" marker-end="url(#ah-ticket)"/><path class="dg-arrow" d="M370 58 L388 58" marker-end="url(#ah-ticket)"/><path class="dg-arrow" d="M560 58 L578 58" marker-end="url(#ah-ticket)"/><path class="dg-arrow" d="M665 86 L665 138" marker-end="url(#ah-ticket)"/>
<path class="dg-arrow" d="M580 168 L510 168 L510 88" marker-end="url(#ah-ticket)"/><text class="dg-label" x="518" y="124">back to the admins</text>
<path class="dg-arrow" d="M430 86 L430 112 L285 112 L285 138" marker-end="url(#ah-ticket)"/><text class="dg-label" x="300" y="106">or resolves it</text></svg>
