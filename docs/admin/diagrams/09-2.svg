<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="dg-playhqsync-t dg-playhqsync-d" class="dg">
<style>.dg text{font-family:system-ui, -apple-system, 'Segoe UI', sans-serif}
.dg-box rect{fill:#FFFFFF;stroke:#E1E5E2;stroke-width:1.5}
.dg-t{fill:#121513;font-size:14px;font-weight:700;text-anchor:middle}
.dg-s{fill:#5D6862;font-size:11.5px;text-anchor:middle}
.dg-m{fill:#121513;font-size:11.5px}
.k-person rect{stroke:#121513}
.k-edge rect{fill:#FFF4D6;stroke:#7A5800}
.k-worker rect{fill:#14274E;stroke:#2F6FDB}
.k-worker .dg-t{fill:#fff}.k-worker .dg-s{fill:#CFE5D6}
.k-store rect{fill:#E4ECFB;stroke:#2F6FDB}
.k-service rect{stroke:#2F6FDB}
.k-job rect{fill:#F6F7F6;stroke:#5D6862;stroke-dasharray:6 4}
.k-stop rect{stroke:#D9262C}.k-stop .dg-t{fill:#D9262C}
.k-done rect{fill:#2F6FDB;stroke:#2F6FDB}
.k-done .dg-t{fill:#fff}.k-done .dg-s{fill:#E3F3E8}
.dg-arrow{fill:none;stroke:#5D6862;stroke-width:1.6}
.dg-arrow.dash{stroke:#2F6FDB;stroke-dasharray:6 4}
.dg-head{fill:#5D6862}
.dg-life{stroke:#E1E5E2;stroke-width:1.2;stroke-dasharray:3 4}
.dg-label{fill:#5D6862;font-size:11.5px;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.dg-label.mid{text-anchor:middle}
.dg-zone rect{fill:none;stroke:#E1E5E2;stroke-width:1.5;stroke-dasharray:7 5}
.dg-zone text{fill:#5D6862;font-size:12px;font-weight:700}</style>
<rect width="760" height="300" fill="#FFFFFF"/>
<title id="dg-playhqsync-t">Keeping a PlayHQ fixture in step</title><desc id="dg-playhqsync-d">The 5-minute job finds each PlayHQ fixture due a check, reads the team&#39;s fixture from PlayHQ&#39;s feed and matches each game to one already here; new games are added, changed ones updated, and ones PlayHQ dropped are marked, never deleted. Checks stop by themselves, and a failed read changes nothing.</desc>
<defs><marker id="ah-playhqsync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs>
<g class="dg-box k-job"><rect x="10" y="16" width="230" height="56" rx="10"/>
<text class="dg-t" x="125" y="41">Due for a check?</text><text class="dg-s" x="125" y="58">8 hours; a tournament hourly</text></g>
<g class="dg-box k-service"><rect x="265" y="16" width="230" height="56" rx="10"/>
<text class="dg-t" x="380" y="41">Read PlayHQ&#39;s feed</text><text class="dg-s" x="380" y="58">the team&#39;s fixture, every game</text></g>
<g class="dg-box k-step"><rect x="520" y="16" width="230" height="56" rx="10"/>
<text class="dg-t" x="635" y="41">Match each game</text><text class="dg-s" x="635" y="58">by PlayHQ&#39;s id, or one added by hand</text></g>
<g class="dg-box k-done"><rect x="10" y="128" width="230" height="56" rx="10"/>
<text class="dg-t" x="125" y="153">New: added</text><text class="dg-s" x="125" y="170">usual tip-off until PlayHQ sets one</text></g>
<g class="dg-box k-done"><rect x="265" y="128" width="230" height="56" rx="10"/>
<text class="dg-t" x="380" y="153">Changed: updated</text><text class="dg-s" x="380" y="170">time, venue, opponent, round</text></g>
<g class="dg-box k-service"><rect x="520" y="128" width="230" height="56" rx="10"/>
<text class="dg-t" x="635" y="153">Dropped: marked</text><text class="dg-s" x="635" y="170">Not on PlayHQ any more</text></g>
<g class="dg-box k-step"><rect x="10" y="228" width="360" height="56" rx="10"/>
<text class="dg-t" x="190" y="253">Checks stop by themselves</text><text class="dg-s" x="190" y="270">VJBL six weeks after its last game</text></g>
<g class="dg-box k-stop"><rect x="390" y="228" width="360" height="56" rx="10"/>
<text class="dg-t" x="570" y="253">A failed read changes nothing</text><text class="dg-s" x="570" y="270">saved on the fixture, shown to team managers</text></g>
<path class="dg-arrow" d="M240 44 L263 44" marker-end="url(#ah-playhqsync)"/><path class="dg-arrow" d="M495 44 L518 44" marker-end="url(#ah-playhqsync)"/>
<path class="dg-arrow" d="M635 72 L635 100 L125 100 L125 126" marker-end="url(#ah-playhqsync)"/><path class="dg-arrow" d="M380 100 L380 126" marker-end="url(#ah-playhqsync)"/><path class="dg-arrow" d="M635 100 L635 126" marker-end="url(#ah-playhqsync)"/></svg>
