<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 404" width="700" height="404" role="img" aria-labelledby="dg-rosterchange-t dg-rosterchange-d" class="dg">
<style>.dg text{font-family:system-ui, -apple-system, 'Segoe UI', sans-serif}
.dg-box rect{fill:#FFFFFF;stroke:#E1E5E2;stroke-width:1.5}
.dg-t{fill:#121513;font-size:14px;font-weight:700;text-anchor:middle}
.dg-s{fill:#5D6862;font-size:11.5px;text-anchor:middle}
.dg-m{fill:#121513;font-size:11.5px}
.k-person rect{stroke:#121513}
.k-edge rect{fill:#FFF4D6;stroke:#7A5800}
.k-worker rect{fill:#14274E;stroke:#2F6FDB}
.k-worker .dg-t{fill:#fff}.k-worker .dg-s{fill:rgba(255,255,255,.78)}
.k-store rect{fill:#E4ECFB;stroke:#2F6FDB}
.k-service rect{stroke:#2F6FDB}
.k-job rect{fill:#F6F7F6;stroke:#5D6862;stroke-dasharray:6 4}
.k-stop rect{stroke:#D9262C}.k-stop .dg-t{fill:#D9262C}
.k-done rect{fill:#2F6FDB;stroke:#2F6FDB}
.k-done .dg-t{fill:#fff}.k-done .dg-s{fill:rgba(255,255,255,.85)}
.dg-arrow{fill:none;stroke:#5D6862;stroke-width:1.6}
.dg-arrow.dash{stroke:#2F6FDB;stroke-dasharray:6 4}
.dg-head{fill:#5D6862}
.dg-life{stroke:#E1E5E2;stroke-width:1.2;stroke-dasharray:3 4}
.dg-label{fill:#5D6862;font-size:11.5px;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.dg-label.mid{text-anchor:middle}
.dg-zone rect{fill:none;stroke:#E1E5E2;stroke-width:1.5;stroke-dasharray:7 5}
.dg-zone text{fill:#5D6862;font-size:12px;font-weight:700}</style>
<rect width="700" height="404" fill="#FFFFFF"/>
<title id="dg-rosterchange-t">What changes the roster</title><desc id="dg-rosterchange-d">Six things change the roster: opening it fills new games&#39; weeks and clears ones with no games, Generate roster shares out next week on again, Change on a week fills that week around the families picked, saving the duties shares out next week on again, a family&#39;s time off counts as done, and Scorers only this week leaves a week with two scorers a game.</desc>
<defs><marker id="ah-rosterchange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs>
<g class="dg-box k-person"><rect x="10" y="16" width="300" height="54" rx="10"/>
<text class="dg-t" x="160" y="40">The Roster opened</text><text class="dg-s" x="160" y="57">by anyone, once it&#39;s generated</text></g>
<path class="dg-arrow" d="M310 43 L368 43" marker-end="url(#ah-rosterchange)"/><g class="dg-box k-done"><rect x="370" y="16" width="320" height="54" rx="10"/>
<text class="dg-t" x="530" y="40">New games&#39; weeks filled</text><text class="dg-s" x="530" y="57">a week with no games left cleared</text></g><g class="dg-box k-person"><rect x="10" y="82" width="300" height="54" rx="10"/>
<text class="dg-t" x="160" y="106">Generate roster</text><text class="dg-s" x="160" y="123">the team manager</text></g>
<path class="dg-arrow" d="M310 109 L368 109" marker-end="url(#ah-rosterchange)"/><g class="dg-box k-done"><rect x="370" y="82" width="320" height="54" rx="10"/>
<text class="dg-t" x="530" y="106">Next week on shared out again</text><text class="dg-s" x="530" y="123">this week and set-by-hand kept</text></g><g class="dg-box k-person"><rect x="10" y="148" width="300" height="54" rx="10"/>
<text class="dg-t" x="160" y="172">Change on a week</text><text class="dg-s" x="160" y="189">families picked by hand</text></g>
<path class="dg-arrow" d="M310 175 L368 175" marker-end="url(#ah-rosterchange)"/><g class="dg-box k-done"><rect x="370" y="148" width="320" height="54" rx="10"/>
<text class="dg-t" x="530" y="172">That week filled around them</text><text class="dg-s" x="530" y="189">and kept by Generate roster</text></g><g class="dg-box k-person"><rect x="10" y="214" width="300" height="54" rx="10"/>
<text class="dg-t" x="160" y="238">Duties saved</text><text class="dg-s" x="160" y="255">on, off, or one family every week</text></g>
<path class="dg-arrow" d="M310 241 L368 241" marker-end="url(#ah-rosterchange)"/><g class="dg-box k-done"><rect x="370" y="214" width="320" height="54" rx="10"/>
<text class="dg-t" x="530" y="238">Next week on shared out again</text><text class="dg-s" x="530" y="255">this week as families know it</text></g><g class="dg-box k-person"><rect x="10" y="280" width="300" height="54" rx="10"/>
<text class="dg-t" x="160" y="304">A family off, then back</text><text class="dg-s" x="160" y="321">away or injured</text></g>
<path class="dg-arrow" d="M310 307 L368 307" marker-end="url(#ah-rosterchange)"/><g class="dg-box k-done"><rect x="370" y="280" width="320" height="54" rx="10"/>
<text class="dg-t" x="530" y="304">Its weeks away count as done</text><text class="dg-s" x="530" y="321">so it isn&#39;t caught up after</text></g><g class="dg-box k-person"><rect x="10" y="346" width="300" height="54" rx="10"/>
<text class="dg-t" x="160" y="370">Scorers only this week</text><text class="dg-s" x="160" y="387">a tournament weekend</text></g>
<path class="dg-arrow" d="M310 373 L368 373" marker-end="url(#ah-rosterchange)"/><g class="dg-box k-done"><rect x="370" y="346" width="320" height="54" rx="10"/>
<text class="dg-t" x="530" y="370">Two scorers a game, no extra</text><text class="dg-s" x="530" y="387">and its games No video</text></g></svg>
