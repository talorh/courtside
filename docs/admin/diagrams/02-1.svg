.dg-life{stroke:#E1E5E2;stroke-width:1.2;stroke-dasharray:3 4}
.dg-label{fill:#5D6862;font-size:11.5px;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.dg-label.mid{text-anchor:middle}
.dg-zone rect{fill:none;stroke:#E1E5E2;stroke-width:1.5;stroke-dasharray:7 5}
.dg-zone text{fill:#5D6862;font-size:12px;font-weight:700}</style>
<rect width="760" height="440" fill="#FFFFFF"/>
<title id="dg-system-t">How the site fits together</title><desc id="dg-system-d">Phones and computers reach the Worker through Cloudflare&#39;s edge protection. The Worker, and its scheduled jobs, use D1, Workers AI, Email Sending, R2, Stream and Images, and hand a stopped-and-restarted live stream&#39;s parts to the joiner, a second small Worker with a container, to make one video. Uploads, playback and photos go from the phone straight to R2, Stream and Images on signed links.</desc>
<defs><marker id="ah-system" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs>
<g class="dg-zone"><rect x="4" y="96" width="752" height="336" rx="14"/><text x="18" y="116">Cloudflare account: Courtside</text></g>
<g class="dg-box k-person"><rect x="280" y="16" width="200" height="56" rx="10"/>
<text class="dg-t" x="380" y="41">Phones and computers</text><text class="dg-s" x="380" y="58">families, coaches, admins</text></g>
<g class="dg-box k-edge"><rect x="250" y="126" width="260" height="56" rx="10"/>
<text class="dg-t" x="380" y="151">Edge protection</text><text class="dg-s" x="380" y="168">DDoS, WAF, human check, rate limits</text></g>
<g class="dg-box k-worker"><rect x="260" y="222" width="240" height="56" rx="10"/>
<text class="dg-t" x="380" y="247">Worker: courtside</text><text class="dg-s" x="380" y="264">pages, API, sign-in</text></g>
<g class="dg-box k-job"><rect x="30" y="222" width="180" height="56" rx="10"/>
<text class="dg-t" x="120" y="247">Scheduled jobs</text><text class="dg-s" x="120" y="264">every 5 minutes, and 3am</text></g>
<g class="dg-box k-worker"><rect x="540" y="126" width="190" height="56" rx="10"/>
<text class="dg-t" x="635" y="151">Joiner: courtside-join</text><text class="dg-s" x="635" y="168">a container with ffmpeg</text></g>
<path class="dg-arrow" d="M380 72 L380 124" marker-end="url(#ah-system)"/><path class="dg-arrow" d="M380 182 L380 220" marker-end="url(#ah-system)"/><path class="dg-arrow" d="M210 250 L258 250" marker-end="url(#ah-system)"/>
<path class="dg-arrow" d="M500 240 L635 240 L635 184" marker-end="url(#ah-system)"/><text class="dg-label" x="510" y="258">a game&#39;s parts to join</text>
<g class="dg-box k-store"><rect x="8" y="356" width="116" height="56" rx="10"/>
<text class="dg-t" x="66" y="381">D1: courtside</text><text class="dg-s" x="66" y="398">every team&#39;s data</text></g><path class="dg-arrow" d="M380 278 L66 354" marker-end="url(#ah-system)"/><g class="dg-box k-service"><rect x="134" y="356" width="116" height="56" rx="10"/>
<text class="dg-t" x="192" y="381">Workers AI</text><text class="dg-s" x="192" y="398">Ask, docs, fixtures</text></g><path class="dg-arrow" d="M380 278 L192 354" marker-end="url(#ah-system)"/><g class="dg-box k-service"><rect x="260" y="356" width="116" height="56" rx="10"/>
<text class="dg-t" x="318" y="381">Email Sending</text><text class="dg-s" x="318" y="398">codes, welcomes</text></g><path class="dg-arrow" d="M380 278 L318 354" marker-end="url(#ah-system)"/><g class="dg-box k-store"><rect x="386" y="356" width="116" height="56" rx="10"/>
<text class="dg-t" x="444" y="381">R2</text><text class="dg-s" x="444" y="398">originals, backups</text></g><path class="dg-arrow" d="M380 278 L444 354" marker-end="url(#ah-system)"/><g class="dg-box k-service"><rect x="512" y="356" width="116" height="56" rx="10"/>
<text class="dg-t" x="570" y="381">Stream</text><text class="dg-s" x="570" y="398">video, clips, live</text></g><path class="dg-arrow" d="M380 278 L570 354" marker-end="url(#ah-system)"/><g class="dg-box k-store"><rect x="638" y="356" width="116" height="56" rx="10"/>
<text class="dg-t" x="696" y="381">Images</text><text class="dg-s" x="696" y="398">photos</text></g><path class="dg-arrow" d="M380 278 L696 354" marker-end="url(#ah-system)"/>
<path class="dg-arrow dash" d="M480 44 L744 44 L744 330 L444 330 L444 354" marker-end="url(#ah-system)"/>
<path class="dg-arrow dash" d="M570 330 L570 354" marker-end="url(#ah-system)"/><path class="dg-arrow dash" d="M696 330 L696 354" marker-end="url(#ah-system)"/>
