<path class="dg-arrow" d="M560 250 L648 250" marker-end="url(#ah-system)"/><text class="dg-label" x="566" y="240">a game&#39;s parts</text><path class="dg-arrow" d="M755 222 L755 184" marker-end="url(#ah-system)"/>
