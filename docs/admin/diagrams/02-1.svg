<rect width="960" height="624" fill="#FFFFFF"/>
<title id="dg-system-t">How the site fits together</title><desc id="dg-system-d">Everything is in the club&#39;s Cloudflare account. Phones and computers come in through the club&#39;s domain (DNS with DNSSEC, registered with Cloudflare Registrar), its edge protection (DDoS, the WAF, bot management, rate limiting, TLS) and its rules (cache, redirects, security headers), with Turnstile checking the sign-in. The Worker serves every page and runs the jobs Cron Triggers start; the Maintenance Worker takes over only while the site is down for work. The Worker uses D1, R2, Stream, Images, Workers AI and Email Sending, and hands a stopped-and-restarted live stream&#39;s parts to the joiner, a Durable Object in the courtside-join Worker, which runs a Container with ffmpeg to make one video. Phones send uploads and photos, and play video, straight to R2, Stream and Images on signed links; an AI tracking camera&#39;s app streams to Stream over RTMPS. Email Routing forwards security@ mail. Artifacts holds the code and Workers Builds deploys it, Previews runs staging, and the admin area reads Workers Logs, GraphQL Analytics and the Billing API.</desc>
