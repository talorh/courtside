<text class="dg-t" x="755" y="151">Container</text><text class="dg-s" x="755" y="168">ffmpeg joins the parts</text></g>
<g class="dg-box k-job"><rect x="30" y="222" width="190" height="56" rx="10"/>
<text class="dg-t" x="125" y="247">Cron Triggers</text><text class="dg-s" x="125" y="264">every 5 minutes, and 3am</text></g>
<g class="dg-box k-worker"><rect x="320" y="222" width="240" height="56" rx="10"/>
<text class="dg-t" x="440" y="247">Worker: courtside</text><text class="dg-s" x="440" y="264">pages, API, sign-in</text></g>
<g class="dg-box k-worker"><rect x="650" y="222" width="210" height="56" rx="10"/>
<text class="dg-t" x="755" y="247">Durable Object: Joiner</text><text class="dg-s" x="755" y="264">in the courtside-join Worker</text></g>
