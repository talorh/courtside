<text class="dg-t" x="219" y="507">GraphQL Analytics</text><text class="dg-s" x="219" y="524">traffic, for Insights</text></g><g class="dg-box k-job"><rect x="298" y="482" width="130" height="56" rx="10"/>
<text class="dg-t" x="363" y="507">Billing API</text><text class="dg-s" x="363" y="524">the bill, for Costs</text></g><g class="dg-box k-job"><rect x="442" y="482" width="130" height="56" rx="10"/>
<text class="dg-t" x="507" y="507">Workers Builds</text><text class="dg-s" x="507" y="524">deploys from Artifacts</text></g><g class="dg-box k-job"><rect x="586" y="482" width="130" height="56" rx="10"/>
