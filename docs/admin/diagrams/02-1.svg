<rect width="880" height="590" fill="#FFFFFF"/>
<title id="dg-system-t">How the site fits together</title><desc id="dg-system-d">Phones and computers reach the Worker through Cloudflare&#39;s edge protection (DDoS, WAF, bot blocking, rate limits), with Turnstile checking the sign-in. Cron Triggers run the Worker&#39;s jobs. The Worker uses D1, R2, Stream, Images, Workers AI and Email Sending, and hands a stopped-and-restarted live stream&#39;s parts to the joiner, a Durable Object in the courtside-join Worker, which runs a Container with ffmpeg to make one video. Uploads, playback and photos go from the phone straight to R2, Stream and Images on signed links. Workers Logs, GraphQL Analytics and the Billing API feed the admin area; Workers Builds deploys from Artifacts, Previews runs staging, and DNS with DMARC looks after the domain.</desc>
<defs><marker id="ah-system" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs>
