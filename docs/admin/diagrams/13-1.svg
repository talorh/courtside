<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="dg-photo-t dg-photo-d" class="dg">
<style>.dg text{font-family:system-ui, -apple-system, 'Segoe UI', sans-serif}
.dg-box rect{fill:#FFFFFF;stroke:#E1E5E2;stroke-width:1.5}
.dg-t{fill:#121513;font-size:14px;font-weight:700;text-anchor:middle}
.dg-s{fill:#5D6862;font-size:11.5px;text-anchor:middle}
.dg-m{fill:#121513;font-size:11.5px}
.k-person rect{stroke:#121513}
.k-edge rect{fill:#FFF4D6;stroke:#7A5800}
.k-worker rect{fill:#14274E;stroke:#2F6FDB}
.k-worker .dg-t{fill:#fff}.k-worker .dg-s{fill:rgba(255,255,255,.78)}
.k-store rect{fill:#E4ECFB;stroke:#2F6FDB}
.k-service rect{stroke:#2F6FDB}
.k-job rect{fill:#F6F7F6;stroke:#5D6862;stroke-dasharray:6 4}
.k-stop rect{stroke:#D9262C}.k-stop .dg-t{fill:#D9262C}
.k-done rect{fill:#2F6FDB;stroke:#2F6FDB}
.k-done .dg-t{fill:#fff}.k-done .dg-s{fill:rgba(255,255,255,.85)}
.dg-arrow{fill:none;stroke:#5D6862;stroke-width:1.6}
.dg-arrow.dash{stroke:#2F6FDB;stroke-dasharray:6 4}
.dg-head{fill:#5D6862}
.dg-life{stroke:#E1E5E2;stroke-width:1.2;stroke-dasharray:3 4}
.dg-label{fill:#5D6862;font-size:11.5px;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.dg-label.mid{text-anchor:middle}
.dg-zone rect{fill:none;stroke:#E1E5E2;stroke-width:1.5;stroke-dasharray:7 5}
.dg-zone text{fill:#5D6862;font-size:12px;font-weight:700}</style>
<rect width="720" height="330" fill="#FFFFFF"/>
<title id="dg-photo-t">A photo&#39;s path</title><desc id="dg-photo-d">The phone makes the photo smaller and drops where it was taken, the Worker checks it&#39;s a JPEG and strips any metadata left, Images keeps it privately, and members see it through signed links that last six hours.</desc>
<defs><marker id="ah-photo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs>
<line class="dg-life" x1="90" y1="60" x2="90" y2="300"/>
<g class="dg-box k-person"><rect x="20" y="14" width="140" height="44" rx="10"/><text class="dg-t" x="90" y="41">Phone</text></g><line class="dg-life" x1="270" y1="60" x2="270" y2="300"/>
<g class="dg-box k-worker"><rect x="200" y="14" width="140" height="44" rx="10"/><text class="dg-t" x="270" y="41">Worker</text></g><line class="dg-life" x1="450" y1="60" x2="450" y2="300"/>
<g class="dg-box k-store"><rect x="380" y="14" width="140" height="44" rx="10"/><text class="dg-t" x="450" y="41">Images</text></g><line class="dg-life" x1="630" y1="60" x2="630" y2="300"/>
<g class="dg-box k-person"><rect x="560" y="14" width="140" height="44" rx="10"/><text class="dg-t" x="630" y="41">Members</text></g>
<path class="dg-arrow" d="M94 100 L266 100" marker-end="url(#ah-photo)"/>
<text class="dg-label mid" x="180" y="92">the photo, redrawn at most 2560 px, no location</text>
<path class="dg-arrow" d="M274 146 L446 146" marker-end="url(#ah-photo)"/>
<text class="dg-label mid" x="360" y="138">a real JPEG, metadata stripped, stored privately</text>
<path class="dg-arrow" d="M266 192 L94 192" marker-end="url(#ah-photo)"/>
<text class="dg-label mid" x="180" y="184">saved, with the photo&#39;s own date</text>
<path class="dg-arrow" d="M626 238 L274 238" marker-end="url(#ah-photo)"/>
<text class="dg-label mid" x="450" y="230">the Photos page</text>
<path class="dg-arrow" d="M274 284 L626 284" marker-end="url(#ah-photo)"/>
<text class="dg-label mid" x="450" y="276">signed links, good for six hours</text></svg>
